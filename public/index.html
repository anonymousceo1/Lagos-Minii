<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lagos Mini Life - Animated Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0f18;
    color: white;
    font-family: system-ui, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    touch-action: none;
  }
  header {
    padding: 11px 16px;
    background: #111827;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #1f2a3a;
    z-index: 40;
  }
  .money { color: #00e676; font-weight: 700; font-size: 1.15rem; }
  #map-container {
    flex: 1;
    position: relative;
    background: #0c121c;
    overflow: hidden;
  }
  .road {
    position: absolute;
    background: #1e293b;
    border-radius: 5px;
    z-index: 1;
  }
  .road-h { height: 18px; }
  .road-v { width: 18px; }
  .tree {
    position: absolute;
    width: 18px;
    height: 18px;
    background: #166534;
    border-radius: 50%;
    z-index: 3;
    box-shadow: 0 0 0 4px #14532d;
  }
  /* Buildings */
  .location {
    position: absolute;
    width: 90px;
    text-align: center;
    z-index: 6;
    pointer-events: none;
  }
  .building {
    width: 70px;
    height: 58px;
    margin: 0 auto 5px;
    position: relative;
    border-radius: 5px 5px 3px 3px;
    box-shadow: 0 8px 16px rgba(0,0,0,0.45);
  }
  .b-home {
    background: linear-gradient(145deg, #60a5fa, #1d4ed8);
  }
  .b-home .door {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 16px;
    height: 26px;
    background: #78350f;
    border-radius: 3px 3px 0 0;
  }
  .b-home .door::after {
    content: '';
    position: absolute;
    top: 12px;
    right: 3px;
    width: 4px;
    height: 4px;
    background: #fbbf24;
    border-radius: 50%;
  }
  .window {
    position: absolute;
    width: 11px;
    height: 11px;
    background: #fef08a;
    border-radius: 2px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.2);
  }
  .b-market { background: linear-gradient(145deg, #f59e0b, #b45309); }
  .b-office { background: linear-gradient(145deg, #64748b, #334155); }
  .b-amala  { background: linear-gradient(145deg, #ef4444, #991b1b); }
  .b-beach  { background: linear-gradient(145deg, #06b6d4, #0e7490); }
  .b-church { background: linear-gradient(145deg, #a855f7, #6b21a8); }
  .b-club   { background: linear-gradient(145deg, #ec4899, #9d174d); }
  .b-okada  { background: linear-gradient(145deg, #84cc16, #4d7c0f); }

  .building::before {
    content: '';
    position: absolute;
    top: -11px;
    left: 6px;
    right: 6px;
    height: 13px;
    background: inherit;
    filter: brightness(1.18);
    border-radius: 4px 4px 0 0;
  }
  .building::after {
    content: '';
    position: absolute;
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 11px;
    background: rgba(0,0,0,0.32);
    border-radius: 50%;
    filter: blur(2px);
  }
  .loc-name {
    font-size: 0.7rem;
    font-weight: 600;
    color: #e2e8f0;
    text-shadow: 0 1px 3px black;
  }
  /* Player with walk animation */
  #player {
    position: absolute;
    width: 26px;
    height: 26px;
    background: #00e676;
    border-radius: 50%;
    border: 3px solid white;
    box-shadow: 0 0 14px #00e676;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    left: 50%;
    top: 60%;
    transform: translate(-50%, -50%);
  }
  #player.walking {
    animation: walkBob 0.35s infinite alternate;
  }
  @keyframes walkBob {
    from { transform: translate(-50%, -50%) translateY(0); }
    to   { transform: translate(-50%, -50%) translateY(-4px); }
  }
  /* Cars */
  .car {
    position: absolute;
    width: 28px;
    height: 14px;
    border-radius: 4px;
    z-index: 8;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
  .car::before {
    content: '';
    position: absolute;
    top: 2px;
    left: 4px;
    width: 8px;
    height: 6px;
    background: rgba(255,255,255,0.35);
    border-radius: 2px;
  }
  /* Controls */
  .controls {
    position: absolute;
    bottom: 28px;
    right: 18px;
    width: 140px;
    height: 140px;
    z-index: 50;
  }
  .ctrl-btn {
    position: absolute;
    width: 46px;
    height: 46px;
    background: rgba(30,41,59,0.92);
    border: 1px solid #334155;
    border-radius: 14px;
    color: white;
    font-size: 1.25rem;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  .ctrl-btn:active { background: #00e676; color: #003d1a; }
  .up    { top: 0; left: 47px; }
  .down  { bottom: 0; left: 47px; }
  .left  { top: 47px; left: 0; }
  .right { top: 47px; right: 0; }
  .info {
    position: absolute;
    bottom: 28px;
    left: 14px;
    background: rgba(17,24,39,0.92);
    padding: 8px 14px;
    border-radius: 16px;
    font-size: 0.8rem;
    border: 1px solid #2a3a4f;
    z-index: 50;
  }
</style>
</head>
<body>
  <header>
    <div>
      <div class="money">₦15,000</div>
      <div style="font-size:0.75rem;color:#94a3b8">Animated Demo</div>
    </div>
    <div style="font-size:0.85rem;color:#94a3b8">Walk + Cars</div>
  </header>

  <div id="map-container">
    <!-- Roads -->
    <div class="road road-h" style="left:10%; top:48%; width:65%;"></div>
    <div class="road road-h" style="left:20%; top:29%; width:52%;"></div>
    <div class="road road-v" style="left:48%; top:20%; height:52%;"></div>
    <div class="road road-v" style="left:27%; top:36%; height:34%;"></div>
    <div class="road road-h" style="left:36%; top:68%; width:40%;"></div>

    <!-- Trees -->
    <div class="tree" style="left:33%; top:37%;"></div>
    <div class="tree" style="left:59%; top:25%;"></div>
    <div class="tree" style="left:70%; top:51%;"></div>
    <div class="tree" style="left:41%; top:57%;"></div>
    <div class="tree" style="left:23%; top:54%;"></div>
    <div class="tree" style="left:77%; top:38%;"></div>
    <div class="tree" style="left:53%; top:74%;"></div>
    <div class="tree" style="left:16%; top:33%;"></div>

    <div id="player">🙂</div>

    <div class="info">Use arrows to walk</div>

    <div class="controls">
      <div class="ctrl-btn up"    id="btn-up">↑</div>
      <div class="ctrl-btn down"  id="btn-down">↓</div>
      <div class="ctrl-btn left"  id="btn-left">←</div>
      <div class="ctrl-btn right" id="btn-right">→</div>
    </div>
  </div>

<script>
const player = document.getElementById('player');
const container = document.getElementById('map-container');

let x = 50, y = 60;
const speed = 1.15;
const keys = { up:false, down:false, left:false, right:false };

// Controls
['up','down','left','right'].forEach(dir => {
  const btn = document.getElementById('btn-' + dir);
  const start = e => { e.preventDefault(); keys[dir] = true; };
  const end   = () => keys[dir] = false;
  btn.addEventListener('touchstart', start);
  btn.addEventListener('touchend', end);
  btn.addEventListener('mousedown', start);
  btn.addEventListener('mouseup', end);
  btn.addEventListener('mouseleave', end);
});

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp') keys.up = true;
  if (e.key === 'ArrowDown') keys.down = true;
  if (e.key === 'ArrowLeft') keys.left = true;
  if (e.key === 'ArrowRight') keys.right = true;
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowUp') keys.up = false;
  if (e.key === 'ArrowDown') keys.down = false;
  if (e.key === 'ArrowLeft') keys.left = false;
  if (e.key === 'ArrowRight') keys.right = false;
});

function update() {
  let moving = false;
  if (keys.up)    { y = Math.max(8, y - speed); moving = true; }
  if (keys.down)  { y = Math.min(90, y + speed); moving = true; }
  if (keys.left)  { x = Math.max(5, x - speed); moving = true; }
  if (keys.right) { x = Math.min(95, x + speed); moving = true; }

  player.style.left = x + '%';
  player.style.top  = y + '%';
  player.classList.toggle('walking', moving);

  requestAnimationFrame(update);
}
update();

// Buildings
const locations = [
  { name: 'Your Room',   cls: 'b-home',   x: 15, y: 71, hasDoor: true },
  { name: 'Balogun',     cls: 'b-market', x: 37, y: 19 },
  { name: 'VI Office',   cls: 'b-office', x: 75, y: 14 },
  { name: 'Amala Spot',  cls: 'b-amala',  x: 57, y: 45 },
  { name: 'Elegushi',    cls: 'b-beach',  x: 83, y: 65 },
  { name: 'Church',      cls: 'b-church', x: 45, y: 81 },
  { name: 'Quilox',      cls: 'b-club',   x: 65, y: 32 },
  { name: 'Okada Stand', cls: 'b-okada',  x: 21, y: 42 },
];

locations.forEach(loc => {
  const el = document.createElement('div');
  el.className = 'location';
  el.style.left = loc.x + '%';
  el.style.top = loc.y + '%';
  el.style.transform = 'translate(-50%, -50%)';

  let extra = '';
  if (loc.hasDoor) {
    extra = `<div class="door"></div>
             <div class="window" style="top:10px;left:9px"></div>
             <div class="window" style="top:10px;right:9px"></div>`;
  } else {
    extra = `<div class="window" style="top:12px;left:10px"></div>
             <div class="window" style="top:12px;right:10px"></div>
             <div class="window" style="top:28px;left:10px"></div>
             <div class="window" style="top:28px;right:10px"></div>`;
  }

  el.innerHTML = `
    <div class="building ${loc.cls}">${extra}</div>
    <div class="loc-name">${loc.name}</div>
  `;
  container.appendChild(el);
});

// Moving cars
const cars = [
  { el: null, x: 15, y: 48, dir: 1, speed: 0.35, color: '#eab308' },
  { el: null, x: 70, y: 29, dir: -1, speed: 0.28, color: '#ef4444' },
  { el: null, x: 48, y: 25, dir: 1, speed: 0.32, color: '#3b82f6', vertical: true },
];

cars.forEach((car, i) => {
  const el = document.createElement('div');
  el.className = 'car';
  el.style.background = car.color;
  el.style.left = car.x + '%';
  el.style.top = car.y + '%';
  container.appendChild(el);
  car.el = el;
});

function moveCars() {
  cars.forEach(car => {
    if (car.vertical) {
      car.y += car.dir * car.speed;
      if (car.y > 70 || car.y < 22) car.dir *= -1;
    } else {
      car.x += car.dir * car.speed;
      if (car.x > 75 || car.x < 12) car.dir *= -1;
    }
    car.el.style.left = car.x + '%';
    car.el.style.top = car.y + '%';
  });
  requestAnimationFrame(moveCars);
}
moveCars();
</script>
</body>
</html>
