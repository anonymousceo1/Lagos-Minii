<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lagos Mini Life</title>
<style>
  :root {
    --bg: #0c1017;
    --panel: #151c28;
    --card: #1e2a3a;
    --border: #2a3748;
    --text: #eef3f9;
    --muted: #8b9cb3;
    --accent: #00e676;
    --accent-dim: #00c853;
    --orange: #ff9100;
    --danger: #ff5252;
    --purple: #b388ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  .hidden { display: none !important; }

  /* ========== START SCREEN ========== */
  #start-screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 20px;
    background: radial-gradient(ellipse at 50% 0%, #1a2a3a 0%, #0c1017 60%);
  }
  #start-screen h1 {
    font-size: 2.1rem;
    font-weight: 800;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #00e676, #69f0ae);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 6px;
  }
  .tagline {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 28px;
    text-align: center;
  }
  .auth-card {
    width: 100%;
    max-width: 360px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 24px 20px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.4);
  }
  .tabs {
    display: flex;
    background: var(--card);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 10px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 0.9rem;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab.active {
    background: var(--accent);
    color: #003d1a;
  }
  .input-group {
    margin-bottom: 14px;
  }
  .input-group label {
    display: block;
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 6px;
    font-weight: 500;
  }
  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 13px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus { border-color: var(--accent); }
  .btn {
    width: 100%;
    background: var(--accent);
    color: #003d1a;
    border: none;
    padding: 15px;
    border-radius: 14px;
    font-weight: 700;
    font-size: 1.05rem;
    cursor: pointer;
    margin-top: 8px;
    transition: transform 0.15s, opacity 0.15s;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .error-msg {
    color: var(--danger);
    font-size: 0.82rem;
    margin-top: 12px;
    text-align: center;
    min-height: 20px;
  }
  .footer-note {
    margin-top: 20px;
    font-size: 0.75rem;
    color: var(--muted);
    text-align: center;
  }

  /* ========== GAME ========== */
  #game {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 480px;
    margin: 0 auto;
    background: var(--bg);
  }
  header {
    background: var(--panel);
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .money {
    font-weight: 800;
    color: var(--accent);
    font-size: 1.25rem;
  }
  .job-label {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 1px;
  }
  .day-info {
    text-align: right;
    font-size: 0.85rem;
  }
  .rent-warn {
    font-size: 0.72rem;
    color: var(--orange);
    margin-top: 2px;
  }

  /* Needs */
  .needs-bar {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    padding: 10px 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .need {
    background: var(--card);
    border-radius: 10px;
    padding: 7px 6px;
    text-align: center;
  }
  .need-name {
    font-size: 0.65rem;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .need-val {
    font-size: 0.8rem;
    font-weight: 700;
  }
  .need-fill {
    height: 4px;
    background: #2a3545;
    border-radius: 2px;
    margin-top: 4px;
    overflow: hidden;
  }
  .need-fill > div {
    height: 100%;
    border-radius: 2px;
    transition: width 0.35s;
  }

  /* Map - denser card grid */
  .map-area {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    background: #0f1520;
  }
  .places-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .place-card {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 16px;
    padding: 14px 12px;
    cursor: pointer;
    transition: all 0.18s;
    position: relative;
  }
  .place-card.selected {
    border-color: var(--accent);
    background: #1a2f28;
    box-shadow: 0 0 0 1px var(--accent);
  }
  .place-card .emoji {
    font-size: 1.6rem;
    margin-bottom: 4px;
  }
  .place-card .name {
    font-weight: 700;
    font-size: 0.9rem;
  }
  .place-card .players-here {
    position: absolute;
    top: 8px;
    right: 8px;
    display: flex;
    gap: 2px;
  }
  .place-card .players-here span {
    font-size: 0.85rem;
    background: rgba(0,0,0,0.35);
    border-radius: 50%;
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Action panel */
  .action-panel {
    background: var(--panel);
    border-top: 1px solid var(--border);
    padding: 14px 14px 18px;
    flex-shrink: 0;
    max-height: 46vh;
    overflow-y: auto;
  }
  .action-panel h3 {
    font-size: 1rem;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
  }
  .action-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 10px;
    border-radius: 14px;
    font-size: 0.82rem;
    cursor: pointer;
    text-align: left;
    transition: background 0.15s;
  }
  .action-btn:active:not(:disabled) { background: #2a3b52; }
  .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .action-btn .cost {
    display: block;
    color: var(--orange);
    font-size: 0.75rem;
    margin-top: 3px;
  }
  .action-btn .effect {
    display: block;
    color: var(--muted);
    font-size: 0.7rem;
    margin-top: 2px;
  }
  .log {
    margin-top: 12px;
    background: var(--card);
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 0.78rem;
    color: var(--muted);
    max-height: 72px;
    overflow-y: auto;
  }
  .log div { margin-bottom: 3px; }

  /* Toast & Modals */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--accent);
    color: #003d1a;
    padding: 12px 22px;
    border-radius: 30px;
    font-weight: 700;
    font-size: 0.9rem;
    z-index: 100;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    max-width: 90%;
    text-align: center;
  }
  .toast.show { opacity: 1; }
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }
  .modal-content {
    background: var(--panel);
    border-radius: 20px;
    padding: 24px;
    max-width: 340px;
    width: 100%;
    border: 1px solid var(--border);
  }
  .modal-content h2 { margin-bottom: 10px; font-size: 1.3rem; }
  .modal-content p { color: var(--muted); margin-bottom: 16px; font-size: 0.9rem; line-height: 1.45; }
  .btn-secondary {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .stat-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.9rem;
  }
</style>
</head>
<body>

<!-- ========== START SCREEN ========== -->
<div id="start-screen">
  <h1>Lagos Mini Life</h1>
  <p class="tagline">Survive rent. Hustle. Live Lagos.</p>

  <div class="auth-card">
    <div class="tabs">
      <div class="tab active" id="tab-login" onclick="switchTab('login')">Login</div>
      <div class="tab" id="tab-register" onclick="switchTab('register')">Register</div>
    </div>

    <div class="input-group">
      <label>Username</label>
      <input type="text" id="username" placeholder="e.g. Tunde" maxlength="16" autocomplete="username">
    </div>
    <div class="input-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••" maxlength="32" autocomplete="current-password">
    </div>
    <div class="input-group hidden" id="confirm-group">
      <label>Confirm Password</label>
      <input type="password" id="confirm-password" placeholder="••••••" maxlength="32">
    </div>

    <button class="btn" id="auth-btn" onclick="handleAuth()">Enter Lagos</button>
    <div class="error-msg" id="auth-error"></div>
  </div>

  <p class="footer-note">Progress is saved · No email needed</p>
</div>

<!-- ========== GAME ========== -->
<div id="game" class="hidden">
  <header>
    <div>
      <div class="money" id="money-display">₦0</div>
      <div class="job-label" id="job-display">Unemployed</div>
    </div>
    <div class="day-info">
      <div id="day-display">Day 1 · Mon</div>
      <div id="time-display">08:00</div>
      <div class="rent-warn" id="rent-warning">Rent in 3 days</div>
    </div>
  </header>

  <div class="needs-bar" id="needs-bar"></div>

  <div class="map-area">
    <div class="places-grid" id="places-grid"></div>
  </div>

  <div class="action-panel">
    <h3>
      <span id="location-title">Select a place</span>
      <button class="btn btn-secondary" style="width:auto;padding:7px 12px;font-size:0.8rem;margin:0" onclick="showPlayers()">Players</button>
    </h3>
    <div class="actions" id="actions"></div>
    <div class="log" id="log"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Players Modal -->
<div id="players-modal" class="modal hidden">
  <div class="modal-content">
    <h2>People in the city</h2>
    <div id="players-list" style="max-height:220px;overflow-y:auto;margin:12px 0"></div>
    <button class="btn btn-secondary" style="width:100%" onclick="closeModal('players-modal')">Close</button>
  </div>
</div>

<!-- Game Over -->
<div id="gameover-modal" class="modal hidden">
  <div class="modal-content">
    <h2 id="go-title">Game Over</h2>
    <p id="go-msg"></p>
    <div id="go-stats"></div>
    <button class="btn" style="width:100%;margin-top:16px" onclick="location.reload()">Play Again</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
// ========== AUTH TABS ==========
let currentTab = 'login';
function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('tab-register').classList.toggle('active', tab === 'register');
  document.getElementById('confirm-group').classList.toggle('hidden', tab === 'login');
  document.getElementById('auth-error').textContent = '';
  document.getElementById('auth-btn').textContent = tab === 'login' ? 'Enter Lagos' : 'Create Account';
}

// ========== SOCKET + STATE ==========
const socket = io();
let state = {
  name: '',
  money: 0,
  job: { id: 'none', name: 'Unemployed', pay: 0 },
  day: 1,
  hour: 8,
  minute: 0,
  needs: { hunger: 70, energy: 80, fun: 50, social: 40, hygiene: 60 },
  location: 'home',
  rentDue: 3,
  rentAmount: 8000,
  players: [],
  log: [],
  busy: false
};

const PLACES = [
  { id: 'home',   name: 'Your Room',      emoji: '🏠', actions: ['sleep','cook','shower','rest'] },
  { id: 'market', name: 'Balogun Market', emoji: '🛒', actions: ['shop_food','hangout'] },
  { id: 'office', name: 'Victoria Island',emoji: '🏢', actions: ['work','apply_job'] },
  { id: 'amala',  name: 'Amala Spot',     emoji: '🍲', actions: ['eat_out','hangout'] },
  { id: 'beach',  name: 'Elegushi Beach', emoji: '🏖️', actions: ['party','hangout','rest'] },
  { id: 'church', name: 'Church',         emoji: '⛪', actions: ['pray','hangout'] },
  { id: 'club',   name: 'Quilox',         emoji: '🎉', actions: ['party','hangout'] },
  { id: 'garage', name: 'Okada Stand',    emoji: '🛵', actions: ['gig_okada','hangout'] },
];

const ACTIONS = {
  sleep:     { label: 'Sleep',          cost: 0,    duration: '6h',  effects: '+70 energy' },
  cook:      { label: 'Cook & Eat',     cost: 800,  duration: '1h',  effects: '+50 hunger' },
  shower:    { label: 'Shower',         cost: 0,    duration: '30m', effects: '+60 hygiene' },
  rest:      { label: 'Rest a bit',     cost: 0,    duration: '1h',  effects: '+20 energy, +5 fun' },
  shop_food: { label: 'Buy groceries',  cost: 2500, duration: '1h',  effects: '+10 hunger' },
  eat_out:   { label: 'Chop amala',     cost: 1500, duration: '1h',  effects: '+55 hunger, +15 fun' },
  work:      { label: 'Work a shift',   cost: 0,    duration: '4h',  effects: 'Earn salary' },
  apply_job: { label: 'Look for work',  cost: 0,    duration: '1h',  effects: 'Chance of job' },
  hangout:   { label: 'Hang with people',cost: 500, duration: '1.5h',effects: '+40 social, +25 fun' },
  party:     { label: 'Party hard',     cost: 5000, duration: '3h',  effects: '+60 fun, +30 social' },
  pray:      { label: 'Pray / Reflect', cost: 0,    duration: '1h',  effects: '+15 fun, +10 energy' },
  gig_okada: { label: 'Okada gig',      cost: 0,    duration: '2h',  effects: 'Earn ₦2k–4.5k' },
};

const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

// ========== AUTH ==========
function handleAuth() {
  const name = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirm-password').value;
  const err = document.getElementById('auth-error');

  if (name.length < 2) return err.textContent = 'Username must be at least 2 characters';
  if (password.length < 3) return err.textContent = 'Password must be at least 3 characters';
  if (currentTab === 'register' && password !== confirm) return err.textContent = 'Passwords do not match';

  err.textContent = '';
  document.getElementById('auth-btn').disabled = true;
  document.getElementById('auth-btn').textContent = 'Entering...';

  socket.emit('join', { name, password });
}

socket.on('error_msg', (msg) => {
  document.getElementById('auth-error').textContent = msg;
  document.getElementById('auth-btn').disabled = false;
  document.getElementById('auth-btn').textContent = currentTab === 'login' ? 'Enter Lagos' : 'Create Account';
});

socket.on('joined', (data) => {
  state.name = data.you.name;
  state.money = data.you.money;
  state.job = data.you.job || { id: 'none', name: 'Unemployed', pay: 0 };
  state.location = data.you.location || 'home';
  state.needs = data.you.needs || state.needs;

  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  renderAll();
  addLog(`Welcome to Lagos, ${state.name}. Rent is ₦${state.rentAmount.toLocaleString()}. Hustle hard.`);
});

// ========== CITY UPDATES ==========
socket.on('city_update', (data) => {
  state.players = data.players || [];
  state.day = data.day || state.day;
  state.hour = data.hour ?? state.hour;
  state.minute = data.minute ?? state.minute;
  renderMap();
  updateHeader();
});

socket.on('action_result', (res) => {
  if (res.money !== undefined) state.money = res.money;
  if (res.needs) state.needs = res.needs;
  if (res.job) state.job = res.job;
  if (res.location) state.location = res.location;
  if (res.msg) {
    addLog(res.msg);
    toast(res.msg);
  }
  state.busy = false;
  renderAll();
});

// ========== RENDER ==========
function renderAll() {
  updateHeader();
  renderNeeds();
  renderMap();
  renderActions();
}

function updateHeader() {
  document.getElementById('money-display').textContent = '₦' + Number(state.money).toLocaleString();
  document.getElementById('job-display').textContent = state.job.name || 'Unemployed';
  document.getElementById('day-display').textContent = `Day ${state.day} · ${DAYS[(state.day-1)%7]}`;
  const h = String(Math.floor(state.hour)).padStart(2,'0');
  const m = String(Math.floor(state.minute)).padStart(2,'0');
  document.getElementById('time-display').textContent = `${h}:${m}`;
  const rentEl = document.getElementById('rent-warning');
  if (state.rentDue <= 1) rentEl.textContent = `⚠ Rent ₦${state.rentAmount.toLocaleString()} due!`;
  else rentEl.textContent = `Rent in ${state.rentDue} days`;
}

function renderNeeds() {
  const bar = document.getElementById('needs-bar');
  const labels = { hunger: 'Hunger', energy: 'Energy', fun: 'Fun', social: 'Social', hygiene: 'Hygiene' };
  const colors = { hunger: '#ff9800', energy: '#42a5f5', fun: '#ec407a', social: '#ab47bc', hygiene: '#26c6da' };
  bar.innerHTML = '';
  for (const [k, v] of Object.entries(state.needs)) {
    const pct = Math.max(0, Math.min(100, Math.round(v)));
    const col = pct < 25 ? 'var(--danger)' : colors[k];
    bar.innerHTML += `
      <div class="need">
        <div class="need-name">${labels[k]}</div>
        <div class="need-val" style="color:${col}">${pct}</div>
        <div class="need-fill"><div style="width:${pct}%;background:${col}"></div></div>
      </div>`;
  }
}

function renderMap() {
  const grid = document.getElementById('places-grid');
  grid.innerHTML = '';
  PLACES.forEach(p => {
    const here = state.players.filter(pl => pl.location === p.id);
    const isMe = state.location === p.id;
    const card = document.createElement('div');
    card.className = 'place-card' + (isMe ? ' selected' : '');
    card.innerHTML = `
      <div class="emoji">${p.emoji}</div>
      <div class="name">${p.name}</div>
      <div class="players-here">${here.slice(0,3).map(pl => `<span title="${pl.name}">${pl.emoji || '🙂'}</span>`).join('')}</div>
    `;
    card.onclick = () => selectPlace(p.id);
    grid.appendChild(card);
  });
}

function renderActions() {
  const place = PLACES.find(p => p.id === state.location);
  document.getElementById('location-title').textContent = place ? `${place.emoji} ${place.name}` : 'Select a place';
  const container = document.getElementById('actions');
  container.innerHTML = '';
  if (!place) return;

  // Travel options
  PLACES.filter(p => p.id !== state.location).slice(0,2).forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'action-btn';
    btn.innerHTML = `Go to ${p.name}<span class="cost">₦200 · 30min</span>`;
    btn.onclick = () => travelTo(p.id);
    container.appendChild(btn);
  });

  place.actions.forEach(aid => {
    const a = ACTIONS[aid];
    if (!a) return;
    if (aid === 'work' && state.job.id === 'none') return;

    const btn = document.createElement('button');
    btn.className = 'action-btn';
    let costStr = a.cost > 0 ? `₦${a.cost.toLocaleString()}` : 'Free';
    if (aid === 'work') costStr = `+₦${(state.job.pay||0).toLocaleString()}`;
    if (aid === 'gig_okada') costStr = '+₦2,000–4,500';
    btn.innerHTML = `${a.label}<span class="cost">${costStr} · ${a.duration}</span><span class="effect">${a.effects}</span>`;
    btn.disabled = state.busy || (a.cost > 0 && state.money < a.cost);
    btn.onclick = () => doAction(aid);
    container.appendChild(btn);
  });
}

// ========== ACTIONS ==========
function selectPlace(id) {
  // just highlight for now — travel still costs
  state.location = id;
  renderMap();
  renderActions();
}

function travelTo(id) {
  if (state.busy) return;
  if (state.money < 200) return toast('Not enough ₦ for transport');
  state.busy = true;
  socket.emit('travel', id);
}

function doAction(aid) {
  if (state.busy) return;
  state.busy = true;
  socket.emit('do_action', aid);
}

// ========== UI HELPERS ==========
function addLog(msg) {
  state.log.unshift(msg);
  if (state.log.length > 20) state.log.pop();
  document.getElementById('log').innerHTML = state.log.slice(0,5).map(m => `<div>• ${m}</div>`).join('');
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

function showPlayers() {
  const list = document.getElementById('players-list');
  const me = state.players.find(p => p.name === state.name);
  let html = '';
  state.players.forEach(p => {
    const place = PLACES.find(pl => pl.id === p.location);
    html += `<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)">
      <span style="font-size:1.2rem">${p.emoji || '🙂'}</span>
      <div>
        <strong>${p.name}${p.name === state.name ? ' (you)' : ''}</strong><br>
        <span style="font-size:0.8rem;color:var(--muted)">${place ? place.name : '?'} · ₦${Number(p.money).toLocaleString()}</span>
      </div>
    </div>`;
  });
  list.innerHTML = html || '<p style="color:var(--muted)">No one else online yet</p>';
  document.getElementById('players-modal').classList.remove('hidden');
}

function closeModal(id) {
  document.getElementById(id).classList.add('hidden');
}

// Enter key support
document.getElementById('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') handleAuth();
});
document.getElementById('confirm-password').addEventListener('keydown', e => {
  if (e.key === 'Enter') handleAuth();
});
</script>
</body>
</html>
