<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lagos Mini Life</title>
<style>
  :root {
    --bg: #0f1419;
    --panel: #1a2332;
    --accent: #00c853;
    --accent2: #ff6d00;
    --text: #e8eef7;
    --muted: #8b9bb4;
    --danger: #ff5252;
    --card: #243044;
    --border: #2d3a4f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }
  .hidden { display: none !important; }
  #start-screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: linear-gradient(160deg, #0f1419 0%, #1a2a3a 50%, #0d1f2d 100%);
  }
  #start-screen h1 {
    font-size: 2.4rem;
    margin-bottom: 8px;
    background: linear-gradient(90deg, #00c853, #69f0ae);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  #start-screen p { color: var(--muted); margin-bottom: 24px; text-align: center; max-width: 360px; }
  .input-group { margin-bottom: 16px; width: 100%; max-width: 320px; }
  .input-group label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
  input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 1rem;
  }
  .btn {
    background: var(--accent);
    color: #000;
    border: none;
    padding: 14px 28px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    transition: transform 0.15s, opacity 0.15s;
  }
  .btn:hover { transform: scale(1.03); }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-sm { padding: 8px 14px; font-size: 0.85rem; border-radius: 8px; }
  #game {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 480px;
    margin: 0 auto;
  }
  header {
    background: var(--panel);
    padding: 10px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .money { font-weight: 700; color: var(--accent); font-size: 1.1rem; }
  .day-info { font-size: 0.85rem; color: var(--muted); text-align: right; }
  .needs-bar {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    padding: 10px 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .need {
    background: var(--card);
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 0.75rem;
  }
  .need-label { display: flex; justify-content: space-between; margin-bottom: 3px; color: var(--muted); }
  .need-fill {
    height: 6px;
    border-radius: 3px;
    background: #333;
    overflow: hidden;
  }
  .need-fill > div {
    height: 100%;
    border-radius: 3px;
    transition: width 0.3s;
  }
  .map-area {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: #15202b;
  }
  #city-map {
    width: 100%;
    height: 100%;
    position: relative;
  }
  .place {
    position: absolute;
    width: 56px;
    height: 56px;
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.15s, border-color 0.15s;
    background: var(--card);
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .place:hover, .place.selected { border-color: var(--accent); transform: scale(1.08); }
  .place-name {
    font-size: 0.55rem;
    color: var(--muted);
    margin-top: 2px;
    text-align: center;
    line-height: 1.1;
    max-width: 52px;
  }
  .player-token, .npc-token {
    position: absolute;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.9rem;
    z-index: 10;
    transition: left 0.8s ease, top 0.8s ease;
    border: 2px solid #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
  .player-token { background: var(--accent); z-index: 20; }
  .npc-token { background: #5c6bc0; }
  .action-panel {
    background: var(--panel);
    border-top: 1px solid var(--border);
    padding: 12px;
    flex-shrink: 0;
    max-height: 42vh;
    overflow-y: auto;
  }
  .action-panel h3 {
    font-size: 0.95rem;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .action-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px;
    border-radius: 10px;
    font-size: 0.8rem;
    cursor: pointer;
    text-align: left;
    transition: background 0.15s;
  }
  .action-btn:hover:not(:disabled) { background: #2d3f5a; }
  .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .action-btn .cost { color: var(--accent2); font-size: 0.75rem; }
  .action-btn .effect { color: var(--muted); font-size: 0.7rem; }
  .log {
    margin-top: 10px;
    background: var(--card);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 0.75rem;
    color: var(--muted);
    max-height: 80px;
    overflow-y: auto;
  }
  .log div { margin-bottom: 3px; }
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--accent);
    color: #000;
    padding: 10px 20px;
    border-radius: 20px;
    font-weight: 600;
    font-size: 0.9rem;
    z-index: 100;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }
  .modal-content {
    background: var(--panel);
    border-radius: 16px;
    padding: 24px;
    max-width: 340px;
    width: 100%;
    border: 1px solid var(--border);
  }
  .modal-content h2 { margin-bottom: 12px; font-size: 1.3rem; }
  .modal-content p { color: var(--muted); margin-bottom: 16px; font-size: 0.9rem; line-height: 1.4; }
  .stat-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.9rem;
  }
  .players-list {
    max-height: 120px;
    overflow-y: auto;
    margin: 8px 0;
  }
  .player-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 0;
    font-size: 0.85rem;
  }
  .player-dot {
    width: 10px; height: 10px; border-radius: 50%;
  }
</style>
</head>
<body>
  <!-- START SCREEN -->
  <div id="start-screen">
    <h1>Lagos Mini Life</h1>
    <p>A tiny multiplayer-style life sim. Earn ₦, manage needs, work, hang out, and survive rent day.</p>
    <div class="input-group">
      <label>Your name</label>
      <input type="text" id="player-name" placeholder="e.g. Tunde" maxlength="16" value="">
    </div>
    <button class="btn" id="start-btn" onclick="startGame()">Enter Lagos</button>
    <p style="margin-top:20px;font-size:0.75rem;color:var(--muted)">No account needed · Local + AI players · In-game ₦ only</p>
  </div>

  <!-- GAME -->
  <div id="game" class="hidden">
    <header>
      <div>
        <div class="money" id="money-display">₦0</div>
        <div style="font-size:0.75rem;color:var(--muted)" id="job-display">Unemployed</div>
      </div>
      <div class="day-info">
        <div id="day-display">Day 1 · Mon</div>
        <div id="time-display">08:00</div>
        <div style="font-size:0.7rem;color:var(--accent2)" id="rent-warning"></div>
      </div>
    </header>

    <div class="needs-bar" id="needs-bar"></div>

    <div class="map-area">
      <div id="city-map"></div>
    </div>

    <div class="action-panel">
      <h3>
        <span id="location-title">Select a place</span>
        <button class="btn btn-sm btn-secondary" onclick="showPlayers()">Players</button>
      </h3>
      <div class="actions" id="actions"></div>
      <div class="log" id="log"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- Players modal -->
  <div id="players-modal" class="modal hidden">
    <div class="modal-content">
      <h2>In the city</h2>
      <div class="players-list" id="players-list"></div>
      <button class="btn btn-secondary" style="width:100%;margin-top:12px" onclick="closeModal('players-modal')">Close</button>
    </div>
  </div>

  <!-- Game over modal -->
  <div id="gameover-modal" class="modal hidden">
    <div class="modal-content">
      <h2 id="go-title">Game Over</h2>
      <p id="go-msg"></p>
      <div id="go-stats"></div>
      <button class="btn" style="width:100%;margin-top:16px" onclick="location.reload()">Play Again</button>
    </div>
  </div>

<script>
// ========== DATA ==========
const PLACES = [
  { id: 'home', name: 'Your Room', emoji: '🏠', x: 12, y: 70, actions: ['sleep','cook','shower','rest'] },
  { id: 'market', name: 'Balogun', emoji: '🛒', x: 40, y: 25, actions: ['shop_food','hangout'] },
  { id: 'office', name: 'Victoria Island', emoji: '🏢', x: 72, y: 20, actions: ['work','apply_job'] },
  { id: 'amala', name: 'Amala Spot', emoji: '🍲', x: 25, y: 45, actions: ['eat_out','hangout'] },
  { id: 'beach', name: 'Elegushi', emoji: '🏖️', x: 80, y: 55, actions: ['party','hangout','rest'] },
  { id: 'church', name: 'Church', emoji: '⛪', x: 55, y: 75, actions: ['pray','hangout'] },
  { id: 'club', name: 'Quilox', emoji: '🎉', x: 65, y: 40, actions: ['party','hangout'] },
  { id: 'garage', name: 'Okada Stand', emoji: '🛵', x: 18, y: 18, actions: ['gig_okada','hangout'] },
];

const ACTIONS = {
  sleep:     { label: 'Sleep', cost: 0, duration: 6, effects: { energy: 70, hunger: -15, hygiene: -10 }, msg: 'You slept. Feeling better.' },
  cook:      { label: 'Cook & Eat', cost: 800, duration: 1, effects: { hunger: 50, energy: -5 }, msg: 'Home food hits different.' },
  shower:    { label: 'Shower', cost: 0, duration: 0.5, effects: { hygiene: 60 }, msg: 'Fresh and clean.' },
  rest:      { label: 'Rest a bit', cost: 0, duration: 1, effects: { energy: 20, fun: 5 }, msg: 'You took a short break.' },
  shop_food: { label: 'Buy groceries', cost: 2500, duration: 1, effects: { hunger: 10 }, msg: 'Stocked up on food.' },
  eat_out:   { label: 'Chop amala', cost: 1500, duration: 1, effects: { hunger: 55, fun: 15, energy: -5 }, msg: 'Amala + ewedu. Blessed.' },
  work:      { label: 'Work a shift', cost: 0, duration: 4, effects: { energy: -35, fun: -20, social: -10, hygiene: -15 }, pay: true, msg: 'Shift done. Pay received.' },
  apply_job: { label: 'Look for work', cost: 0, duration: 1, effects: { energy: -10 }, special: 'job', msg: 'You asked around for openings.' },
  hangout:   { label: 'Hang with people', cost: 500, duration: 1.5, effects: { social: 40, fun: 25, energy: -10 }, msg: 'Good vibes with the people.' },
  party:     { label: 'Party', cost: 5000, duration: 3, effects: { fun: 60, social: 30, energy: -40, hygiene: -20, hunger: -15 }, msg: 'Night was wild.' },
  pray:      { label: 'Pray / Reflect', cost: 0, duration: 1, effects: { fun: 15, energy: 10, social: 10 }, msg: 'Peace of mind.' },
  gig_okada: { label: 'Okada gig', cost: 0, duration: 2, effects: { energy: -25, hygiene: -15, fun: -5 }, pay: 'okada', msg: 'You rode for hours. Cash in hand.' },
};

const JOBS = [
  { id: 'none', name: 'Unemployed', pay: 0, level: 0 },
  { id: 'okada', name: 'Okada Rider', pay: 4500, level: 1 },
  { id: 'sales', name: 'Shop Attendant', pay: 7000, level: 2 },
  { id: 'office', name: 'Office Assistant', pay: 12000, level: 3 },
  { id: 'manager', name: 'Team Lead', pay: 22000, level: 4 },
];

const NPC_NAMES = ['Chioma','Emeka','Funke','Bola','Ada','Kemi','Segun','Ngozi','Tobi','Yemi','Ife','Damilola'];
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

// ========== STATE ==========
let state = {
  name: '',
  money: 15000,
  job: JOBS[0],
  day: 1,
  hour: 8,
  minute: 0,
  needs: { hunger: 70, energy: 80, fun: 50, social: 40, hygiene: 60 },
  location: 'home',
  rentDue: 3, // days until rent
  rentAmount: 8000,
  inventory: { food: 2 },
  log: [],
  busyUntil: 0,
  npcs: [],
  gameOver: false,
};

// ========== INIT ==========
function startGame() {
  const name = document.getElementById('player-name').value.trim() || 'Player';
  state.name = name;
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  initNPCs();
  renderMap();
  renderNeeds();
  renderActions();
  updateHeader();
  addLog(`Welcome to Lagos, ${name}. You have ₦${state.money.toLocaleString()}. Rent is ₦${state.rentAmount.toLocaleString()} in ${state.rentDue} days.`);
  // Game loop
  setInterval(tick, 2000); // every 2 real sec ≈ 10 game min
  setInterval(npcTick, 4000);
}

function initNPCs() {
  const used = new Set();
  for (let i = 0; i < 6; i++) {
    let n;
    do { n = NPC_NAMES[Math.floor(Math.random()*NPC_NAMES.length)]; } while (used.has(n));
    used.add(n);
    const place = PLACES[Math.floor(Math.random()*PLACES.length)];
    state.npcs.push({
      id: i,
      name: n,
      money: 5000 + Math.floor(Math.random()*30000),
      location: place.id,
      emoji: ['😎','🥰','😤','🥳','😌','🤔'][i],
    });
  }
}

// ========== RENDER ==========
function renderMap() {
  const map = document.getElementById('city-map');
  map.innerHTML = '';
  PLACES.forEach(p => {
    const el = document.createElement('div');
    el.className = 'place' + (state.location === p.id ? ' selected' : '');
    el.style.left = p.x + '%';
    el.style.top = p.y + '%';
    el.style.transform = 'translate(-50%, -50%)';
    el.innerHTML = `${p.emoji}<div class="place-name">${p.name}</div>`;
    el.onclick = () => selectPlace(p.id);
    map.appendChild(el);
  });
  // Player token
  const playerPlace = PLACES.find(p => p.id === state.location);
  if (playerPlace) {
    const tok = document.createElement('div');
    tok.className = 'player-token';
    tok.style.left = `calc(${playerPlace.x}% - 4px)`;
    tok.style.top = `calc(${playerPlace.y}% + 18px)`;
    tok.textContent = '🙂';
    tok.title = state.name;
    map.appendChild(tok);
  }
  // NPCs
  state.npcs.forEach(npc => {
    const pl = PLACES.find(p => p.id === npc.location);
    if (!pl) return;
    const tok = document.createElement('div');
    tok.className = 'npc-token';
    // slight offset so they don't stack perfectly
    const ox = (npc.id % 3 - 1) * 12;
    const oy = (Math.floor(npc.id / 3) - 0.5) * 10;
    tok.style.left = `calc(${pl.x}% + ${ox}px)`;
    tok.style.top = `calc(${pl.y}% + ${18 + oy}px)`;
    tok.textContent = npc.emoji;
    tok.title = npc.name;
    map.appendChild(tok);
  });
}

function renderNeeds() {
  const bar = document.getElementById('needs-bar');
  const labels = { hunger: 'Hunger', energy: 'Energy', fun: 'Fun', social: 'Social', hygiene: 'Hygiene' };
  const colors = { hunger: '#ff9800', energy: '#2196f3', fun: '#e91e63', social: '#9c27b0', hygiene: '#00bcd4' };
  bar.innerHTML = '';
  for (const [k, v] of Object.entries(state.needs)) {
    const pct = Math.max(0, Math.min(100, v));
    const col = pct < 25 ? 'var(--danger)' : colors[k];
    bar.innerHTML += `
      <div class="need">
        <div class="need-label"><span>${labels[k]}</span><span>${Math.round(pct)}</span></div>
        <div class="need-fill"><div style="width:${pct}%;background:${col}"></div></div>
      </div>`;
  }
}

function renderActions() {
  const place = PLACES.find(p => p.id === state.location);
  document.getElementById('location-title').textContent = place ? `${place.emoji} ${place.name}` : 'Select a place';
  const container = document.getElementById('actions');
  container.innerHTML = '';
  if (!place) return;

  // Travel buttons to other places
  const others = PLACES.filter(p => p.id !== state.location);
  others.slice(0, 2).forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'action-btn';
    btn.innerHTML = `Go to ${p.name}<br><span class="cost">₦200 · 30min</span>`;
    btn.onclick = () => travelTo(p.id);
    container.appendChild(btn);
  });

  place.actions.forEach(aid => {
    const a = ACTIONS[aid];
    if (!a) return;
    // Hide work if no job
    if (aid === 'work' && state.job.id === 'none') return;
    // Hide apply if already have decent job
    if (aid === 'apply_job' && state.job.level >= 3) return;

    const btn = document.createElement('button');
    btn.className = 'action-btn';
    let costStr = a.cost > 0 ? `₦${a.cost.toLocaleString()}` : 'Free';
    if (a.pay === true) costStr = `+₦${state.job.pay.toLocaleString()}`;
    if (a.pay === 'okada') costStr = '+₦2,000–4,500';
    const eff = Object.entries(a.effects || {}).map(([k,v]) => `${v>0?'+':''}${v} ${k}`).join(', ');
    btn.innerHTML = `${a.label}<br><span class="cost">${costStr} · ${a.duration}h</span><br><span class="effect">${eff}</span>`;
    btn.disabled = state.busyUntil > now() || (a.cost > 0 && state.money < a.cost);
    btn.onclick = () => doAction(aid);
    container.appendChild(btn);
  });
}

function updateHeader() {
  document.getElementById('money-display').textContent = '₦' + state.money.toLocaleString();
  document.getElementById('job-display').textContent = state.job.name;
  document.getElementById('day-display').textContent = `Day ${state.day} · ${DAYS[(state.day-1)%7]}`;
  const h = String(Math.floor(state.hour)).padStart(2,'0');
  const m = String(Math.floor(state.minute)).padStart(2,'0');
  document.getElementById('time-display').textContent = `${h}:${m}`;
  const rentEl = document.getElementById('rent-warning');
  if (state.rentDue <= 1) rentEl.textContent = `⚠ Rent ₦${state.rentAmount.toLocaleString()} due soon!`;
  else rentEl.textContent = `Rent in ${state.rentDue} days`;
}

// ========== ACTIONS ==========
function selectPlace(id) {
  // just highlight; travel is separate
  state.location = id; // for simplicity allow instant select + travel cost on action
  // Actually better: selecting shows actions including travel
  renderMap();
  renderActions();
}

function travelTo(id) {
  if (state.busyUntil > now()) return;
  if (state.money < 200) {
    toast('Not enough money for transport');
    return;
  }
  state.money -= 200;
  advanceTime(0.5);
  state.location = id;
  const place = PLACES.find(p => p.id === id);
  addLog(`You went to ${place.name}.`);
  renderMap();
  renderActions();
  updateHeader();
  renderNeeds();
}

function doAction(aid) {
  if (state.busyUntil > now() || state.gameOver) return;
  const a = ACTIONS[aid];
  if (!a) return;
  if (a.cost > 0 && state.money < a.cost) {
    toast('Not enough ₦');
    return;
  }

  state.money -= a.cost || 0;

  // Apply effects
  if (a.effects) {
    for (const [k, v] of Object.entries(a.effects)) {
      if (state.needs[k] !== undefined) {
        state.needs[k] = Math.max(0, Math.min(100, state.needs[k] + v));
      }
    }
  }

  // Pay
  if (a.pay === true) {
    state.money += state.job.pay;
    addLog(`You earned ₦${state.job.pay.toLocaleString()} from work.`);
  } else if (a.pay === 'okada') {
    const earn = 2000 + Math.floor(Math.random() * 2500);
    state.money += earn;
    addLog(`Okada gig paid ₦${earn.toLocaleString()}.`);
  }

  // Special
  if (a.special === 'job') {
    tryGetJob();
  }

  advanceTime(a.duration);
  addLog(a.msg);
  toast(a.msg);

  // Social chance with NPCs here
  const here = state.npcs.filter(n => n.location === state.location);
  if (here.length && (aid === 'hangout' || aid === 'party')) {
    const npc = here[Math.floor(Math.random()*here.length)];
    addLog(`You hung out with ${npc.name}.`);
    state.needs.social = Math.min(100, state.needs.social + 10);
  }

  renderNeeds();
  renderActions();
  updateHeader();
  checkDeath();
}

function tryGetJob() {
  if (state.job.level >= 4) return;
  const chance = 0.4 + state.job.level * 0.1;
  if (Math.random() < chance) {
    const next = JOBS[Math.min(state.job.level + 1, JOBS.length - 1)];
    // find next available
    const idx = JOBS.findIndex(j => j.id === state.job.id);
    const newJob = JOBS[Math.min(idx + 1, JOBS.length - 1)];
    if (newJob.id !== state.job.id) {
      state.job = newJob;
      addLog(`🎉 You got a new job: ${newJob.name}! Pay: ₦${newJob.pay.toLocaleString()}/shift`);
      toast(`New job: ${newJob.name}`);
    } else {
      addLog('No new openings right now. Try again later.');
    }
  } else {
    addLog('No luck finding better work today.');
  }
}

// ========== TIME & NEEDS ==========
function now() { return state.day * 24 + state.hour + state.minute / 60; }

function advanceTime(hours) {
  state.busyUntil = now() + hours;
  let h = state.hour + hours;
  while (h >= 24) {
    h -= 24;
    state.day++;
    state.rentDue--;
    // Daily need decay is handled in tick; here just day change
    if (state.rentDue <= 0) {
      collectRent();
    }
  }
  state.hour = h;
  state.minute = (state.minute + (hours % 1) * 60) % 60;
  updateHeader();
}

function collectRent() {
  if (state.money >= state.rentAmount) {
    state.money -= state.rentAmount;
    state.rentDue = 7;
    addLog(`🏠 Rent paid: ₦${state.rentAmount.toLocaleString()}. Next due in 7 days.`);
    toast('Rent paid!');
    // small rent increase over time
    if (state.day > 14) state.rentAmount = Math.floor(state.rentAmount * 1.05);
  } else {
    // failed rent
    endGame(false, 'You couldn\'t pay rent. Landlord locked you out.');
  }
  updateHeader();
}

function tick() {
  if (state.gameOver) return;
  // advance ~10 game minutes
  state.minute += 10;
  if (state.minute >= 60) {
    state.minute -= 60;
    state.hour++;
    if (state.hour >= 24) {
      state.hour = 0;
      state.day++;
      state.rentDue--;
      if (state.rentDue <= 0) collectRent();
    }
  }
  // Needs decay
  state.needs.hunger = Math.max(0, state.needs.hunger - 0.8);
  state.needs.energy = Math.max(0, state.needs.energy - 0.5);
  state.needs.fun = Math.max(0, state.needs.fun - 0.4);
  state.needs.social = Math.max(0, state.needs.social - 0.3);
  state.needs.hygiene = Math.max(0, state.needs.hygiene - 0.35);

  renderNeeds();
  updateHeader();
  checkDeath();
}

function npcTick() {
  if (state.gameOver) return;
  // Move some NPCs
  state.npcs.forEach(npc => {
    if (Math.random() < 0.35) {
      const p = PLACES[Math.floor(Math.random() * PLACES.length)];
      npc.location = p.id;
    }
  });
  renderMap();
}

function checkDeath() {
  const critical = Object.values(state.needs).some(v => v <= 0);
  if (critical) {
    const low = Object.entries(state.needs).filter(([k,v]) => v <= 0).map(([k]) => k);
    endGame(false, `Your ${low.join(' & ')} hit zero. You collapsed.`);
  }
}

function endGame(win, msg) {
  state.gameOver = true;
  document.getElementById('go-title').textContent = win ? 'You Made It!' : 'Game Over';
  document.getElementById('go-msg').textContent = msg;
  document.getElementById('go-stats').innerHTML = `
    <div class="stat-row"><span>Days survived</span><span>${state.day}</span></div>
    <div class="stat-row"><span>Final money</span><span>₦${state.money.toLocaleString()}</span></div>
    <div class="stat-row"><span>Job</span><span>${state.job.name}</span></div>
  `;
  document.getElementById('gameover-modal').classList.remove('hidden');
}

// ========== UI HELPERS ==========
function addLog(msg) {
  state.log.unshift(msg);
  if (state.log.length > 30) state.log.pop();
  const el = document.getElementById('log');
  el.innerHTML = state.log.slice(0, 6).map(m => `<div>• ${m}</div>`).join('');
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function showPlayers() {
  const list = document.getElementById('players-list');
  list.innerHTML = `
    <div class="player-row"><span class="player-dot" style="background:var(--accent)"></span><strong>${state.name}</strong> (you) · ₦${state.money.toLocaleString()}</div>
  `;
  state.npcs.forEach(n => {
    const pl = PLACES.find(p => p.id === n.location);
    list.innerHTML += `<div class="player-row"><span class="player-dot" style="background:#5c6bc0"></span>${n.emoji} ${n.name} · at ${pl ? pl.name : '?'} · ₦${n.money.toLocaleString()}</div>`;
  });
  document.getElementById('players-modal').classList.remove('hidden');
}

function closeModal(id) {
  document.getElementById(id).classList.add('hidden');
}

// Allow Enter key on start
document.getElementById('player-name').addEventListener('keydown', e => {
  if (e.key === 'Enter') startGame();
});
</script>
